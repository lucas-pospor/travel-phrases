name: Bug
description: Something in the app doesn't work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android or iOS version
      description: For example "Pixel 8, Android 16"
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of Settings.
  - type: dropdown
    id: source
    attributes:
      label: Where you installed the app
      options:
        - GitHub release
        - F-Droid
        - Google Play
        - App Store
        - Built it myself
